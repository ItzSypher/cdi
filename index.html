<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CDI Refrigeração | Proposta de presença digital</title>
    <meta name="description" content="Na internet, a CDI Refrigeração ainda aparece como Nevaska. Veja quanto isso custa e como a Fox TI Solutions resolve." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070A10" />
    <link rel="icon" type="image/svg+xml" href="/cdi-logo.svg" />
    <meta property="og:title" content="CDI Refrigeração | Proposta Fox TI" />
    <meta property="og:description" content="Quanto custa não ser encontrado, e o plano para virar o jogo." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:locale" content="pt_BR" />
    <script>
      // aplica o tema antes do primeiro paint para não piscar
      (function () {
        var t = null;
        try { t = localStorage.getItem("cdi-tema"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
